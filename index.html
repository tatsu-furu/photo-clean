<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>写真の位置情報けし｜写真は端末の外に送りません</title>
  <meta name="description" content="写真に埋め込まれた撮影場所（GPS）などの情報を確かめて消すツール．写真はアップロードせず，ブラウザの中だけで処理します．画質は落としません．">
  <meta name="author" content="aL">
  <meta name="theme-color" content="#2C6E5F">
  <meta property="og:title" content="写真の位置情報けし">
  <meta property="og:description" content="写真に埋め込まれた撮影場所などの情報を，端末の中だけで確かめて消します．">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <a class="skip" href="#drop">本文へ移動</a>

  <header class="top">
    <h1 class="title">写真の位置情報けし</h1>
    <p class="promise" id="promise">写真はこの端末の外に送られません</p>
  </header>

  <main class="main">
    <section class="intro" aria-label="できること">
      <p>SNS やフリマアプリ，ブログに載せる前に，写真に入っている撮影場所（GPS）などを確かめて消します。画像を描き直さないので，画質は変わりません。機内モードでも使えます。</p>
    </section>

    <label class="drop" id="drop" for="file">
      <input class="visually-hidden" type="file" id="file" accept="image/*,.heic,.heif" multiple>
      <span class="drop-main">写真を選ぶ</span>
      <span class="drop-sub">ここにドラッグ＆ドロップ，またはクリックして選択．貼り付け（Ctrl / ⌘ + V）もできます</span>
      <span class="drop-note">JPEG・PNG・WebP ／ 一度に 50 枚まで，1 枚 50MB まで</span>
    </label>

    <fieldset class="modes">
      <legend>消し方</legend>
      <label class="mode"><input type="radio" name="mode" value="location" checked>
        <span><b>位置情報だけ消す</b><small>GPS を消します。撮影日時や向きは残ります。</small></span></label>
      <label class="mode"><input type="radio" name="mode" value="all">
        <span><b>すべて消す</b><small>EXIF・XMP・IPTC・コメントなどをまとめて消します。写真の向きと色の情報は残します。</small></span></label>
    </fieldset>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ul class="cards" id="cards"></ul>
  </main>

  <div class="actions" id="actions" hidden>
    <button type="button" class="btn btn-primary" id="btn-clean">消して保存</button>
    <button type="button" class="btn" id="btn-zip" hidden>まとめて zip で保存</button>
    <button type="button" class="btn" id="btn-share" hidden>共有（写真に保存・SNS）</button>
    <button type="button" class="btn btn-quiet" id="btn-clear">すべてクリア</button>
  </div>

  <footer class="foot">
    <p>写真のデータは保存しません。ページを閉じれば消えます。アクセス解析も入れていません。</p>
    <p>© 2026 <a href="https://alt4l.dev/">aL / alt4L</a></p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
